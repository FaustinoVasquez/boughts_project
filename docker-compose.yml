services:
  nginx:
    image: nginx:latest
    ports:
      - 8081:80
    depends_on:
      - php
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/conf/fastcgi.conf:/etc/nginx/fastcgi.conf:ro
      - ./boughts:/var/www/
      # - ./logs/nginx:/var/log/nginx 
    networks:
      - app-network
    restart: always

  php:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    working_dir: /var/www
    volumes:
      - ./boughts:/var/www
      # - ./logs/php:/var/log/php-fpm
      # - ./boughts/.env:/var/www/.env
    networks:
      - app-network
    depends_on:
      - redis
    command: [ "php-fpm", "-F" ]

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    networks:
      - app-network
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

networks:
  app-network:
    driver: bridge

volumes:
  redis-data:
    driver: local
